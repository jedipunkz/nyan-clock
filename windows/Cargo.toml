[package]
name = "nyan-clock"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "NyanClock"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = ["tray-icon", "custom-protocol"] }
tauri-plugin-window-state = "2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
