name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to increment
        required: true
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  contents: write

concurrency: release

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          IFS=. read -r major minor patch <<< "${latest#v}"
          major=${major:-0} minor=${minor:-0} patch=${patch:-0}
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "unknown bump: $BUMP" >&2; exit 1 ;;
          esac
          echo "${latest:-none} -> $major.$minor.$patch"
          echo "version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./build.sh
          ditto -c -k --keepParent build/NyanClock.app "NyanClock-$VERSION.zip"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" "NyanClock-$VERSION.zip" \
            --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
