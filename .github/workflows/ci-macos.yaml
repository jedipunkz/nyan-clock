name: CI (macOS)

on:
  push:
    branches: [main]
    paths: [macos/**, .github/workflows/ci-macos.yaml]
  pull_request:
    paths: [macos/**, .github/workflows/ci-macos.yaml]

permissions:
  contents: read

defaults:
  run:
    working-directory: macos

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./build.sh
      - run: plutil -lint build/NyanClock.app/Contents/Info.plist
      - run: codesign --verify --strict build/NyanClock.app
